    padding:0 20px
  }
  .mode-strip {
    padding:8px 22px
  }
  .main-content {
    padding:26px 23px
  }
  .welcome-banner {
    grid-template-columns:1.1fr 1fr
  }
  .workbench {

  }
  .toast {

  }
  .main-footer {
    font-size:8px;

  }
  .global-search {
    max-width:300px
  }
  .sidebar-footer {
    padding-bottom:8px
  }
}
@media(max-width:650px) {
  .main-content {
    padding:24px 17px
  }
  .topbar {
    gap:8px;
    padding:0 14px
  }
  .global-search {
    width:auto;
    max-width:none;
    flex:1
  }
  .global-search input {
    font-size:10px
  }
  .learn-toggle {
    font-size:9px;
    padding:0 4px
  }
  .learn-toggle svg {
    display:none
  }
  .role-control {
    padding-left:9px;
    gap:5px
  }
  .role-control>.avatar {
    display:none
  }
  .role-control select {
    width:68px;
    font-size:10px
  }
  .role-control small {
    font-size:7px
  }
  .mode-strip {
    padding:7px 17px;

  }

  .mode-strip>span:first-child {

  }

    font-size:8px
  }
  .page-heading {

  .heading-actions {

    width:100%
  }
  .page-heading h1 {
    font-size:25px
  }
  .page-heading p {
    font-size:11px
  }
  .eyebrow {
    font-size:9px;
    letter-spacing:1.3px
  }
  .welcome-banner {
    display:block;
    padding:26px 24px
  }
  .flow-visual {
    display:none
  }
  .welcome-banner h2 {
    font-size:26px
  }
  .welcome-banner p {
    font-size:11px
  }
  .welcome-banner .btn.primary {
    font-size:11px
  }
  .kpi-grid {
    gap:10px
  }
  .kpi-card {
    padding:16px
  }
  .kpi-card>strong {
    font-size:29px
  }
  .kpi-card p {
    font-size:8px
  }
  .kpi-icon {
    width:25px;
    height:25px
  }
  .kpi-card>div {
    font-size:10px
  }
  .dashboard-grid,.dashboard-bottom {
    grid-template-columns:1fr;
    gap:18px
  }
  .mix-panel {
    padding-bottom:8px
  }
  .category-total {
    padding-bottom:11px
  }
  .category-row {
    margin-bottom:15px
  }
  .learning-card {
    padding:25px
  }
  .learning-card h2 br {
    display:none
  }
  .learning-card p br {
    display:none
  }
  .learning-card h2 {
    font-size:21px
  }
  .learning-card p {
    font-size:11px
  }
  .main-footer {
    padding:0 20px 23px;
    flex-direction:column;
    gap:8px
  }
  .help {
    padding:14px;
    gap:10px
  }
  .help p {
    font-size:10px
  }
  .workbench {
    grid-template-columns:1fr;
    gap:20px
  }
  .ticket-list {
    position:static
  }
  .ticket-scroll {
    max-height:295px
  }
  .ticket-item {
    padding:14px 17px
  }
  .ticket-item>div>small {
    font-size:9px
  }
  .ticket-item h3 {
    font-size:12px;
    margin-top:8px
  }
  .ticket-item p {
    display:none
  }
  .ticket-item footer {
    margin-top:10px
  }
  .detail-heading h2 {
    font-size:19px
  }
  .detail-body {
    padding:20px
  }
  .detail-meta {
    font-size:10px
  }
  .detail-controls {
    gap:10px
  }
  .detail-tabs {
    gap:24px
  }
  .detail-tabs button {
    font-size:11px
  }
  .order-summary strong {
    font-size:13px
  }
  .message p {
    font-size:12px
  }
  .composer textarea {
    font-size:12px
  }
  .composer-actions>.primary {
    margin-left:auto
  }
  .notes h3 small {
    font-size:9px;

  }
  .mini-stats {

  }
  .mini-stats button {
    padding:17px

  .table-toolbar {

  .table-toolbar>.input-icon {

  .approval-card {

  }
  .approval-card-heading>div:nth-child(2) {

  }
  .approval-card-heading>.badge {
    margin-left:52px
  }
  .approval-details {

  }
  .approval-details strong {
    font-size:12px
  }
  .approval-details span {
    font-size:9px

  .approval-card footer {

  }
  .approval-card footer .btn {

  .approval-card footer>div {

  }
  .segmented {

  }
  .segmented button {

  }
  .notice {
    font-size:10px
  }
  .import-footer>div {

  }
  .report-kpis {

  }
  .report-kpis>div {
    padding:17px
  }
  .report-kpis span {
    font-size:9px
  }
  .report-kpis strong {

  .settings-grid {

  }

  .learning-intro p {

  }
  .scenario-heading p {

  }
  .scenario-heading .check-label {

  }
  .scenario ol {
    margin-left:0;

  }
  .scenario li {
    font-size:11px
  }
  .scenario-actions .btn {
    font-size:10px
  }
  .form-grid {

  }

@media(prefers-reduced-motion:reduce) {
  * {
    scroll-behavior:auto!important;
    animation:none!important;
    transition:none!important
  }
}
@media print {
  .sidebar,.topbar,.mode-strip,.heading-actions,.toast,.main-footer,.help,.btn,.file-button {
    display:none!important
  }
  .main-shell {
    margin:0;
    width:100%
  }
  .main-content {
    padding:0
  }
  .panel {
    box-shadow:none;
    break-inside:avoid
  }
  .page-heading {
    margin-bottom:20px
  }
  .table-wrap {
    overflow:visible
  }
  body {
    background:#fff
  }
  .dashboard-grid,.dashboard-bottom {
    display:block
  }
  .welcome-banner {
    background:white;
    color:#333;

  .welcome-banner h2,.welcome-banner p {
    color:#333
  }
  .flow-visual {
    display:none
  }
}

.scenario li,.scenario-heading p,.quiz p,.settings-card>p {

}

  font-size:13px;
  line-height:1.85
}
.help p {
  font-size:12px;
  color:#5f7b70
}
.settings-card>small,.settings-card dt,.settings-card dd,.boundary-list li {
  color:#617b6d
}
.import-guide p,.numbered-item p {
  color:#617b72;
  font-size:12px
}
@media(max-width:1090px) {
  .import-guide {
    display:block
  }
  .import-layout {
    grid-template-columns:1fr
  }
}
